<!-- ระบบบังคับล็อกอิน (Auth Guard): ถ้ายังไม่ล็อกอินด้วย @phukhieo.ac.th จะเด้งไปหน้า pagelogin.html ทันที -->
<script>
  (function enforceSchoolSystemLock() {
    const rawAuth = localStorage.getItem("pk_seller_auth");
    if (!rawAuth) {
      sessionStorage.setItem("pk_redirect_after_login", window.location.href);
      window.location.replace("pagelogin.html");
      return;
    }
    try {
      const auth = JSON.parse(rawAuth);
      if (!auth.email || !auth.email.toLowerCase().endsWith("@phukhieo.ac.th")) {
        localStorage.removeItem("pk_seller_auth");
        window.location.replace("pagelogin.html");
      }
    } catch (e) {
      localStorage.removeItem("pk_seller_auth");
      window.location.replace("pagelogin.html");
    }
  })();
</script>

<script type="module" src="js/app.js" defer></script>
